<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 36" width="84" height="36">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9FAFB"/>
      <stop offset="1" stop-color="#DDE2DF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="82" height="34" rx="10" fill="url(#plate)"/>
  <!-- dominant-baseline="central" centers the glyphs vertically on y=18 (the plate's middle) -->
  <text x="42" y="18" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800"
        letter-spacing="0.5">
    <tspan fill="#374151">w</tspan><tspan fill="#22C55E">8</tspan><tspan fill="#0A0A0A">t</tspan>
  </text>
</svg>
